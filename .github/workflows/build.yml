name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
#        os: [windows-latest, macos-latest, ubuntu-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B -ntp clean install -Dno-format

      - name: Build with Maven (Native)
        run: mvn -B -ntp install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip

  topaz-previous:
    name: Previous Topaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      # The deployment tests again against the previous Topaz release, to catch protocol or behaviour drift.
      - name: Test against Topaz 0.33.22
        run: mvn -B -ntp -Dno-format -pl deployment,security/deployment,zanzibar/deployment -am test -Dquarkus.topaz.devservices.image-name=ghcr.io/aserto-dev/topaz:0.33.22

  quarkus-main:
    name: Quarkus main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Quarkus main (the 4.0 line, with Vert.x 5 and Jackson 3) from the snapshot the Quarkus ecosystem CI publishes.
      # The extension must keep working on it, so every PR builds and tests against it.
      - name: Install the Quarkus main snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo quarkusio/quarkus-ecosystem-ci --limit 30 --json tagName \
            --jq '[.[] | select(.tagName | startswith("maven-repo-main-"))][0].tagName')
          echo "Using $tag"
          gh release download "$tag" --repo quarkusio/quarkus-ecosystem-ci --pattern maven-repo.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p ~/.m2/repository
          tar xzf "$RUNNER_TEMP/maven-repo.tar.gz" -C ~/.m2/repository

      - name: Build with Maven against Quarkus main
        run: mvn -B -ntp clean install -Dno-format -Dquarkus.version=999-SNAPSHOT
